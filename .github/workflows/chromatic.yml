name: Chromatic

# Publishes Storybook to Chromatic for a hosted, versioned Storybook URL and
# visual review. Needs a CHROMATIC_PROJECT_TOKEN repository secret; without it
# the job skips instead of failing.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    runs-on: ubuntu-latest
    env:
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - name: Skip when no Chromatic token is configured
        if: env.CHROMATIC_PROJECT_TOKEN == ''
        run: echo "CHROMATIC_PROJECT_TOKEN is not set; skipping Chromatic."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          # Chromatic compares against git history to find baselines.
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: env.CHROMATIC_PROJECT_TOKEN != ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        with:
          node-version: 22
          cache: pnpm

      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm install --frozen-lockfile

      - if: env.CHROMATIC_PROJECT_TOKEN != ''
        run: pnpm build-storybook --quiet

      - name: Publish to Chromatic
        if: env.CHROMATIC_PROJECT_TOKEN != ''
        # Visual changes are reviewed in Chromatic, so they don't fail CI here.
        run: pnpm exec chromatic --storybook-build-dir public/storybook --exit-zero-on-changes
